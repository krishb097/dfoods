<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dhwarkadhish Food Court — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{--accent:#0b8f4a;--muted:#666}
  body{font-family:Inter,Arial,Helvetica,sans-serif;margin:0;background:#f6f7fb;color:#111}
  header{background:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}
  .logo{width:44px;height:44px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .container{max-width:1200px;margin:18px auto;padding:12px}
  .layout{display:grid;grid-template-columns:1fr 380px;gap:18px}
  @media(max-width:980px){.layout{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,0.04)}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:680px){.menu-grid{grid-template-columns:1fr}}
  .item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;border:1px solid #f1f1f3}
  .thumb{width:84px;height:64px;border-radius:8px;overflow:hidden;background:#f8faf8}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .meta h3{margin:0}
  input,select,button{padding:10px;border-radius:8px;border:1px solid #e6e6e9}
  .cart-list{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow:auto;margin-top:8px}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;border:1px solid #f1f1f3;background:linear-gradient(180deg,#fff,#fbfbfb)}
  .row{display:flex;justify-content:space-between;margin:6px 0}
  .tot{font-weight:700;font-size:18px}
  .checkout{background:var(--accent);color:#fff;padding:10px;border:0;border-radius:8px;cursor:pointer;width:100%}
  .secondary{background:#fff;color:var(--accent);border:1px solid var(--accent);cursor:pointer;padding:8px;border-radius:8px}
  footer{text-align:center;color:var(--muted);padding:18px 0;margin-top:12px}
  .small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <div class="logo">D</div>
    <div>
      <div style="font-weight:700">Dhwarkadhish Food Court</div>
      <div class="small">Dashboard — Veg Demo (LocalStorage)</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <div id="sessionTxt" class="small"></div>
      <button id="btnLogout" class="secondary" style="display:none">Logout</button>
      <a href="manage-dishes.html" class="secondary" style="text-decoration:none;padding:10px;border-radius:8px">Manage Dishes</a>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <div>
        <div class="card">
          <div style="display:flex;gap:8px;align-items:center">
            <input id="search" placeholder="Search dish or stall..." style="flex:1">
            <select id="stallFilter"><option value="all">All Stalls</option><option value="1">Stall 1 — Dosa Corner</option><option value="2">Stall 2 — Punjab Dhaba</option><option value="3">Stall 3 — Dragon Wok</option><option value="4">Stall 4 — Street Bites</option><option value="5">Stall 5 — Sweet Sip</option></select>
            <button id="reset" class="secondary">Reset</button>
          </div>
          <div id="menu" class="menu-grid" style="margin-top:12px"></div>
        </div>

        <div class="card" style="margin-top:12px">
          <h3 style="margin:0">Saved Orders</h3>
          <div id="ordersList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
        </div>
      </div>

      <aside>
        <div class="card">
          <h3 style="margin:0">Cart</h3>
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <input id="custName" placeholder="Customer name" style="flex:1">
            <input id="custPhone" placeholder="Phone" style="width:120px">
          </div>

          <div class="cart-list" id="cartList"></div>

          <div style="margin-top:12px">
            <div class="row"><div>Subtotal</div><div id="subTotal">₹0.00</div></div>
            <div class="row"><div>GST (5%)</div><div id="gstAmt">₹0.00</div></div>
            <div class="row"><div>Service (2%)</div><div id="serviceAmt">₹0.00</div></div>
            <div class="row"><div>Discount</div><div><input id="discount" type="number" value="0" style="width:80px"> ₹</div></div>
            <div class="row tot"><div>Total</div><div id="totalAmt">₹0.00</div></div>
            <button id="payMain" class="checkout">Pay at Main Admin (Full)</button>
            <button id="payPerStall" class="secondary" style="margin-top:8px">Create Per-Stall Pending</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer><small>Demo — LocalStorage only. Image used: /mnt/data/9eec5254-3cdb-405c-be8e-54c847ae264a.png</small></footer>

<!-- receipt modal uses bill.html (embedded via JS) -->

<script>
const IMG_DEFAULT = '/mnt/data/9eec5254-3cdb-405c-be8e-54c847ae264a.png';
const LS = {
  DISHES: 'dhw_dishes_v1',
  CART: 'dhw_cart_v1',
  ORDERS: 'dhw_orders_v1',
  USERS: 'dhw_users_v1',
  SESSION: 'dhw_session_v1',
  LAST: 'dhw_last_receipt_v1'
};
const GST = 0.05, SERVICE = 0.02;

let state = {
  dishes: JSON.parse(localStorage.getItem(LS.DISHES) || '[]'),
  cart: JSON.parse(localStorage.getItem(LS.CART) || '[]'),
  orders: JSON.parse(localStorage.getItem(LS.ORDERS) || '[]'),
  users: JSON.parse(localStorage.getItem(LS.USERS) || '[]'),
  session: JSON.parse(localStorage.getItem(LS.SESSION) || 'null')
};

// ensure default dishes if none
(function ensureDefaults(){
  if(!state.dishes || state.dishes.length===0){
    const d = [
      {id:1,name:'Masala Dosa',price:85,category:'South Indian',stall:1,img:IMG_DEFAULT},
      {id:2,name:'Rava Idli (2 pcs)',price:55,category:'South Indian',stall:1,img:IMG_DEFAULT},
      {id:3,name:'Veg Biryani (Half)',price:140,category:'Main Course',stall:2,img:IMG_DEFAULT},
      {id:4,name:'Paneer Butter Masala',price:160,category:'Main Course',stall:2,img:IMG_DEFAULT},
      {id:5,name:'Veg Fried Rice',price:120,category:'Main Course',stall:3,img:IMG_DEFAULT},
      {id:6,name:'Veg Burger',price:99,category:'Burgers',stall:4,img:IMG_DEFAULT},
      {id:7,name:'Spring Roll (2 pcs)',price:80,category:'Snacks',stall:4,img:IMG_DEFAULT},
      {id:8,name:'Masala Chai',price:25,category:'Beverages',stall:5,img:IMG_DEFAULT},
      {id:9,name:'Gulab Jamun (2 pcs)',price:50,category:'Dessert',stall:5,img:IMG_DEFAULT},
      {id:10,name:'Schezwan Noodles',price:140,category:'Main Course',stall:3,img:IMG_DEFAULT}
    ];
    state.dishes = d; localStorage.setItem(LS.DISHES, JSON.stringify(state.dishes));
  }
  // ensure admin user
  let users = JSON.parse(localStorage.getItem(LS.USERS) || '[]');
  if(!users.some(u=>u.username==='admin')){ users.push({username:'admin',password:'admin123',role:'admin'}); localStorage.setItem(LS.USERS, JSON.stringify(users)); }
})();

document.addEventListener('DOMContentLoaded', ()=>{
  state.session = JSON.parse(localStorage.getItem(LS.SESSION) || 'null');
  updateSessionUI();

  document.getElementById('search').addEventListener('input', renderMenu);
  document.getElementById('stallFilter').addEventListener('change', renderMenu);
  document.getElementById('reset').addEventListener('click', ()=>{document.getElementById('search').value='';document.getElementById('stallFilter').value='all'; renderMenu();});
  document.getElementById('payMain').addEventListener('click', payMainAdmin);
  document.getElementById('payPerStall').addEventListener('click', createPerStallPending);
  document.getElementById('btnLogout').addEventListener('click', doLogout);
  document.getElementById('discount').addEventListener('input', updateTotals);

  renderMenu();
  renderCart();
  renderOrders();
});

// UI helpers
function updateSessionUI(){
  const s = JSON.parse(localStorage.getItem(LS.SESSION) || 'null');
  if(s){ document.getElementById('sessionTxt').textContent = `${s.username} (${s.role})`; document.getElementById('btnLogout').style.display='inline-block'; }
  else { document.getElementById('sessionTxt').textContent = 'Not logged in'; document.getElementById('btnLogout').style.display='none'; }
}

// menu render (filter by stall field which is numeric 1..5)
function renderMenu(){
  state.dishes = JSON.parse(localStorage.getItem(LS.DISHES) || '[]');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const stallFilter = document.getElementById('stallFilter').value;
  const list = state.dishes.filter(d=>{
    const matchQ = !q || d.name.toLowerCase().includes(q) || (d.category && d.category.toLowerCase().includes(q));
    const matchStall = (stallFilter==='all') || String(d.stall) === stallFilter;
    return matchQ && matchStall;
  });
  const menu = document.getElementById('menu');
  if(!list.length){ menu.innerHTML = '<div class="small">No items found</div>'; return; }
  menu.innerHTML = list.map(i=>`
    <div class="item">
      <div class="thumb"><img src="${i.img || IMG_DEFAULT}" alt=""></div>
      <div class="meta">
        <h3>${escape(i.name)}</h3>
        <div class="small">${escape(i.category)} • Stall ${i.stall} — ${stallName(i.stall)}</div>
        <div style="font-weight:700;margin-top:6px">₹${Number(i.price).toFixed(2)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
        <button onclick="addToCart(${i.id})">Add</button>
        <button onclick="openStallPage(${i.stall})" class="secondary">Open Stall</button>
      </div>
    </div>
  `).join('');
}

function stallName(n){
  switch(Number(n)){
    case 1: return 'Dosa Corner — South Indian';
    case 2: return 'Punjab Dhaba — Punjabi Specials';
    case 3: return 'Dragon Wok — Chinese';
    case 4: return 'Street Bites — Fast Food';
    case 5: return 'Sweet Sip — Desserts & Drinks';
    default: return 'Stall '+n;
  }
}

// cart functions
function addToCart(id){
  state.cart = JSON.parse(localStorage.getItem(LS.CART) || '[]');
  const dish = (state.dishes||[]).find(d=>d.id===id);
  if(!dish) return;
  const existing = state.cart.find(c=>c.id===id);
  if(existing) existing.qty++;
  else state.cart.push({id:dish.id,name:dish.name,price:dish.price,qty:1,stall:dish.stall});
  localStorage.setItem(LS.CART, JSON.stringify(state.cart));
  renderCart();
}

function renderCart(){
  state.cart = JSON.parse(localStorage.getItem(LS.CART) || '[]');
  const list = document.getElementById('cartList');
  if(!state.cart.length){ list.innerHTML = '<div class="small">Cart is empty</div>'; updateTotals(); return; }
  list.innerHTML = '';
  state.cart.forEach(ci=>{
    const div = document.createElement('div'); div.className='cart-item';
    div.innerHTML = `<div>${escape(ci.name)} <div class="small">${stallName(ci.stall)}</div></div><div style="text-align:right">₹${(ci.price*ci.qty).toFixed(2)}<div style="margin-top:6px"><button onclick="changeQty(${ci.id},-1)">-</button> <span style="margin:0 8px">${ci.qty}</span> <button onclick="changeQty(${ci.id},1)">+</button></div></div>`;
    list.appendChild(div);
  });
  updateTotals();
}

function changeQty(id,delta){
  state.cart = JSON.parse(localStorage.getItem(LS.CART) || '[]');
  const it = state.cart.find(c=>c.id===id);
  if(!it) return;
  it.qty = Math.max(0, it.qty + delta);
  if(it.qty===0) state.cart = state.cart.filter(c=>c.id!==id);
  localStorage.setItem(LS.CART, JSON.stringify(state.cart));
  renderCart();
}

function updateTotals(){
  state.cart = JSON.parse(localStorage.getItem(LS.CART) || '[]');
  const sub = state.cart.reduce((s,i)=>s + i.price * i.qty,0);
  const gst = +(sub * GST).toFixed(2);
  const service = +(sub * SERVICE).toFixed(2);
  const disc = Math.max(0, parseFloat(document.getElementById('discount').value || 0));
  const total = Math.max(0, +(sub + gst + service - disc).toFixed(2));
  document.getElementById('subTotal').textContent = '₹' + sub.toFixed(2);
  document.getElementById('gstAmt').textContent = '₹' + gst.toFixed(2);
  document.getElementById('serviceAmt').textContent = '₹' + service.toFixed(2);
  document.getElementById('totalAmt').textContent = '₹' + total.toFixed(2);
}

// checkout: pay at main admin (single order)
function payMainAdmin(){
  state.cart = JSON.parse(localStorage.getItem(LS.CART) || '[]');
  if(!state.cart.length){ alert('Cart is empty'); return; }
  const name = document.getElementById('custName').value.trim() || 'Walk-in';
  const phone = document.getElementById('custPhone').value.trim() || '';
  const sub = state.cart.reduce((s,i)=>s + i.price * i.qty,0);
  const gst = +(sub * GST).toFixed(2);
  const service = +(sub * SERVICE).toFixed(2);
  const disc = Math.max(0, parseFloat(document.getElementById('discount').value || 0));
  const total = Math.max(0, +(sub + gst + service - disc).toFixed(2));
  const order = {
    id: 'ORD' + Date.now(),
    date: new Date().toISOString(),
    customer:{name,phone},
    items: JSON.parse(JSON.stringify(state.cart)),
    subtotal:sub, gst, service, discount:disc, total,
    paidTo:'main', paidAmount: total, perStallPaid: {}
  };
  state.orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
  state.orders.push(order);
  localStorage.setItem(LS.ORDERS, JSON.stringify(state.orders));
  localStorage.setItem(LS.LAST, JSON.stringify(order));
  // clear cart
  localStorage.removeItem(LS.CART);
  renderCart(); renderOrders();
  openBillPopup(order);
  alert('Payment received at main admin. Stall bills cleared for this order.');
}

// create per-stall pending main order (paidTo: 'partial')
function createPerStallPending(){
  state.cart = JSON.parse(localStorage.getItem(LS.CART) || '[]');
  if(!state.cart.length){ alert('Cart is empty'); return; }
  const name = document.getElementById('custName').value.trim() || 'Walk-in';
  const phone = document.getElementById('custPhone').value.trim() || '';
  const sub = state.cart.reduce((s,i)=>s + i.price * i.qty,0);
  const gst = +(sub * GST).toFixed(2);
  const service = +(sub * SERVICE).toFixed(2);
  const disc = Math.max(0, parseFloat(document.getElementById('discount').value || 0));
  const total = Math.max(0, +(sub + gst + service - disc).toFixed(2));
  const main = {
    id: 'ORD' + Date.now(),
    date: new Date().toISOString(),
    customer:{name,phone},
    items: JSON.parse(JSON.stringify(state.cart)),
    subtotal:sub, gst, service, discount:disc, total,
    paidTo:'partial', paidAmount:0, perStallPaid: {}
  };
  state.orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
  state.orders.push(main);
  localStorage.setItem(LS.ORDERS, JSON.stringify(state.orders));
  localStorage.setItem(LS.LAST, JSON.stringify(main));
  // keep cart (user still holds order until stalls get paid)
  renderOrders();
  openBillPopup(main);
  alert('Per-stall pending order created. Stalls will pay their parts on their pages.');
}

// render saved orders
function renderOrders(){
  state.orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
  const el = document.getElementById('ordersList'); el.innerHTML = '';
  if(!state.orders.length){ el.innerHTML = '<div class="small">No saved orders</div>'; return; }
  state.orders.slice().reverse().forEach(o=>{
    const d = document.createElement('div'); d.className='card'; d.style.padding='8px'; d.style.display='flex'; d.style.justifyContent='space-between'; d.style.alignItems='center';
    d.innerHTML = `<div><strong>${o.id}</strong><div class="small">${new Date(o.date).toLocaleString()}</div><div class="small">PaidTo: ${escape(o.paidTo || 'N/A')} | PaidAmt: ₹${(o.paidAmount||0).toFixed(2)}</div></div>
      <div style="display:flex;gap:8px"><button onclick='openOrder("${o.id}")'>Open</button><button onclick='downloadOrder("${o.id}")' class="secondary">JSON</button></div>`;
    el.appendChild(d);
  });
}

function openOrder(id){
  const orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
  const o = orders.find(x=>x.id===id);
  if(!o) return alert('Order not found');
  openBillPopup(o);
}

function downloadOrder(id){
  const orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  const blob = new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=id+'.json'; a.click(); URL.revokeObjectURL(url);
}

// popup: bill/receipt
function openBillPopup(order){
  // open small popup using new window with bill.html?data=...
  const w = window.open('bill.html','billpopup','width=600,height=700');
  // pass via localStorage LAST to let bill.html read it
  localStorage.setItem(LS.LAST, JSON.stringify(order));
}

// helpers
function escape(s){ return String(s||'').replace(/[&"'<>]/g,c=>({'&':'&amp;','"':'&quot;',"'":'&#39;','<':'&lt;','>':'&gt;'}[c])); }
function format(n){ return Number(n||0).toFixed(2); }

// logout
function doLogout(){ if(!confirm('Logout?')) return; localStorage.removeItem(LS.SESSION); window.location.href='login.html'; }

// open stall page
function openStallPage(num){ window.location.href = 'stall' + num + '.html'; }

// listen for storage changes to update across tabs
window.addEventListener('storage', (e)=>{ if([LS.DISHES,LS.ORDERS,LS.CART].includes(e.key)){ renderMenu(); renderCart(); renderOrders(); } });

</script>
</body>
</html>
