<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dhwarkadhish Food Court — Admin</title>
<style>
:root{--accent:#0b8f4a;--muted:#6b7280}
body{font-family:Inter,Arial,Helvetica,sans-serif;margin:0;background:#f3f6f4;color:#111}
header{background:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8e8e8}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.container{max-width:1000px;margin:20px auto;padding:12px}
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 6px 18px rgba(20,20,20,0.04)}
.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}
a.button{display:inline-block;padding:10px 12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none}
.small{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:8px}
table td, table th{padding:8px;border-bottom:1px solid #f1f1f3}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">D</div>
    <div>
      <div style="font-weight:700">Dhwarkadhish Food Court — Admin</div>
      <div class="small">Dashboard</div>
    </div>
  </div>
  <div>
    <span id="sessionTxt" class="small"></span>
    <button id="btnLogout" style="margin-left:8px;padding:8px;border-radius:8px;border:1px solid #e6e6e9;background:#fff;cursor:pointer">Logout</button>
  </div>
</header>

<main class="container">
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
    <a class="button" href="manage-dishes.html">Manage Dishes (Card View)</a>
    <a class="button" href="index.html" style="background:#fff;color:var(--accent);border:1px solid #e6e6e9">Open Billing</a>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h3 style="margin-top:0">Recent Orders</h3>
        <div id="ordersArea"></div>
      </div>
    </div>

    <aside>
      <div class="card">
        <h3 style="margin-top:0">Quick Stats</h3>
        <div id="statsArea"></div>
      </div>
    </aside>
  </div>
</main>

<script>
const LS = { ORDERS:'dhw_orders_v1', SESSION:'dhw_session_v1', DISHES:'dhw_dishes_v1' };
let orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
let session = JSON.parse(localStorage.getItem(LS.SESSION) || 'null');

(function checkSession(){
  if(!session || session.role!=='admin'){ window.location.href='login.html'; }
  else document.getElementById('sessionTxt').textContent = session.username + ' (' + session.role + ')';
})();

document.getElementById('btnLogout').addEventListener('click', ()=>{ if(!confirm('Logout?')) return; localStorage.removeItem(LS.SESSION); window.location.href='login.html'; });

function renderOrders(){
  const el = document.getElementById('ordersArea'); el.innerHTML='';
  orders = JSON.parse(localStorage.getItem(LS.ORDERS) || '[]');
  if(!orders.length){ el.innerHTML = '<div class="small">No orders yet</div>'; return; }
  const list = orders.slice().reverse().slice(0,10);
  list.forEach(o=>{
    const d = document.createElement('div'); d.style.padding='8px'; d.style.borderBottom='1px solid #f1f1f3';
    d.innerHTML = `<strong>${o.id}</strong><div class="small">${new Date(o.date).toLocaleString()}</div><div class="small">Total: ₹${(o.total||0).toFixed(2)}</div>`;
    el.appendChild(d);
  });
}

function renderStats(){
  const dishes = JSON.parse(localStorage.getItem(LS.DISHES) || '[]');
  const totalOrders = orders.length;
  const totalRevenue = orders.reduce((s,o)=>s + (o.total||0), 0);
  const el = document.getElementById('statsArea');
  el.innerHTML = `<div class="small">Dishes: ${dishes.length}</div><div class="small">Orders: ${totalOrders}</div><div class="small">Revenue: ₹${totalRevenue.toFixed(2)}</div>`;
}

renderOrders();
renderStats();
</script>
</body>
</html>
